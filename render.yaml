services:
  - type: web
    name: agricultural-backend
    runtime: python
    plan: free
    rootDir: backend
    branch: feature/Evans
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_SECONDS
        value: "86400"
      - key: DATABASE_URL
        fromDatabase:
          name: agricultural-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAX_CONTENT_LENGTH
        value: "52428800"
      # AI Farming Assistant: AI_PROVIDER=ollama (the local default) has
      # no reachable Ollama server on Render, so production must use the
      # Anthropic provider this app already supports (see
      # app/services/ai_providers.py). Degrades gracefully (feature
      # disabled, not a crash) if ANTHROPIC_API_KEY is left blank.
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_API_KEY
        sync: false
      # SMTP delivery for password-reset / admin-notification emails.
      # Optional -- email_service.py degrades gracefully without it.
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: ADMIN_NOTIFICATION_EMAILS
        sync: false
    # Uncomment to make uploaded files (post images, profile photos,
    # story images) survive redeploys -- requires a paid `plan:` above,
    # and add UPLOAD_FOLDER=/var/data/uploads (matching mountPath) to
    # envVars above once this is enabled.
    # disk:
    #   name: agricultural-uploads
    #   mountPath: /var/data/uploads
    #   sizeGB: 1

  - type: web
    name: agricultural-frontend
    runtime: static
    rootDir: frontend
    branch: feature/Evans
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      # The backend's real deployed URL + /api, e.g.
      # https://agricultural-backend.onrender.com/api. Only known after
      # the backend's first deploy.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_USE_MOCKS
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: agricultural-db
    plan: free
    databaseName: agri_super_app
    user: agri_super_app
