services:
  - type: web
    name: agricultural-backend
    runtime: python
    plan: free
    rootDir: backend
    branch: feature/Evans
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    # --timeout 90: gunicorn's default 30s worker timeout is shorter than
    # GeminiProvider's 60s request timeout (see ai_providers.py) -- under
    # its own "high demand" slowness, a worker could get killed for
    # appearing hung before our own timeout ever gets a chance to fire.
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 90"
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_SECONDS
        value: "86400"
      - key: DATABASE_URL
        fromDatabase:
          name: agricultural-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAX_CONTENT_LENGTH
        value: "52428800"
      # AI Farming Assistant: AI_PROVIDER=ollama (the local default) has
      # no reachable Ollama server on Render, so production must use a
      # hosted provider this app already supports (see
      # app/services/ai_providers.py). Gemini is the default here because
      # it has a genuinely free tier (a key from
      # https://aistudio.google.com needs no billing setup); switch to
      # anthropic + ANTHROPIC_API_KEY instead if preferred. Degrades
      # gracefully (feature disabled, not a crash) if the selected
      # provider's key is left blank.
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Shared secret required on every request to /api/channels/* (SMS/
      # USSD/voice webhooks -- see app/routes/channel_routes.py). These
      # routes can't use JWT (telecom providers don't carry a browser
      # session), so this is their only authentication; the check fails
      # closed if this is left unset, in every environment, not just
      # production. Set this to a real, unique secret before pointing
      # any telecom provider's webhook URL at this deployment, e.g.
      # `?secret=<this value>` appended to the callback URL, or the
      # X-Channel-Webhook-Secret header if the provider supports custom
      # headers.
      - key: CHANNEL_WEBHOOK_SECRET
        sync: false
      # SMTP delivery for password-reset / admin-notification emails.
      # Optional -- email_service.py degrades gracefully without it.
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: ADMIN_NOTIFICATION_EMAILS
        sync: false
      # Uploaded files (post images, profile photos, story images, reel
      # videos) go to a free Supabase Storage bucket instead of local
      # disk, which is ephemeral on this (free) plan -- wiped on every
      # redeploy. From a free https://supabase.com project: SUPABASE_URL
      # is the project URL (Settings -> API); SUPABASE_SERVICE_ROLE_KEY
      # is the "service_role" secret key on that same page (NOT the
      # "anon" key -- anon can't write to Storage); SUPABASE_STORAGE_BUCKET
      # is a bucket you create under Storage, set to Public so uploaded
      # files are viewable. See app/services/upload_service.py. Falls
      # back to local disk when any of the three is left blank.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
    # Alternative to Supabase Storage above: a paid persistent disk, so local-
    # disk storage itself survives redeploys. Requires a paid `plan:`
    # above, and add UPLOAD_FOLDER=/var/data/uploads (matching
    # mountPath) to envVars above once this is enabled.
    # disk:
    #   name: agricultural-uploads
    #   mountPath: /var/data/uploads
    #   sizeGB: 1

  - type: web
    name: agricultural-frontend
    runtime: static
    rootDir: frontend
    branch: feature/Evans
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      # The backend's real deployed URL + /api, e.g.
      # https://agricultural-backend.onrender.com/api. Only known after
      # the backend's first deploy.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_USE_MOCKS
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: agricultural-db
    plan: free
    databaseName: agri_super_app
    user: agri_super_app
